<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>HANA — квітковий магазин</title>
    <meta name="description" content="HANA — авторські букети, сезонні квіти та конструктор власного букета з доставкою." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4A5A4A" />
    <script>
      /* Ставимо тему до першого рендеру, щоб не було спалаху світлої теми */
      try {
        var t = JSON.parse(localStorage.getItem('hana.theme'));
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
