<div class="page">
  <img class="decor decor--l" src="flowers/fav-peony-l.png" alt="" aria-hidden="true" />
  <img class="decor decor--r" src="flowers/fav-peony-r.png" alt="" aria-hidden="true" />
  <img class="decor decor--lines" src="flowers/fav-lines-r.png" alt="" aria-hidden="true" />
  <img class="decor decor--petal petal-1" src="flowers/about-petal.png" alt="" aria-hidden="true" />
  <img class="decor decor--petal petal-2" src="flowers/about-petal.png" alt="" aria-hidden="true" />
  <img class="decor decor--petal petal-3" src="flowers/about-petal.png" alt="" aria-hidden="true" />

  <!-- Світла тема: той самий декор, що й на сторінці букета (піон, листя, пелюстки) -->
  <img class="lt-art lt-mock lt-mock-l" src="flowers/pd-lt-mock-l.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-mock lt-mock-l-peony" src="flowers/pd-lt-mock-l.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-mock lt-mock-r" src="flowers/pd-lt-mock-r.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-petal" style="left:59.510vw;top:6.280vw;width:5.682vw" src="flowers/pd-lt-mock-p1.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-petal" style="left:66.089vw;top:0.299vw;width:5.084vw" src="flowers/pd-lt-mock-p2.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-petal" style="left:78.349vw;top:20.335vw;width:6.280vw" src="flowers/pd-lt-mock-p3.png" alt="" aria-hidden="true" />
  <img class="lt-art lt-petal" style="left:89.414vw;top:30.203vw;width:5.383vw" src="flowers/pd-lt-mock-p4.png" alt="" aria-hidden="true" />

  <!-- Темна тема: піон у правому верхньому куті, як на сторінці букета -->
  <img class="dk-art dk-corner" src="flowers/contacts-dark-peony.png" alt="" aria-hidden="true" />
  <img class="dk-art dk-left-top" src="flowers/pd-dark-a-left-top.png" alt="" aria-hidden="true" />
  <img class="dk-art dk-bl pd-cl" src="flowers/pd-cl-a.jpg" alt="" aria-hidden="true" />
  <img class="dk-art dk-br pd-cl" src="flowers/pd-cl-a.jpg" alt="" aria-hidden="true" />

  @if (active(); as id) {
    <app-bouquet-customizer [id]="id" />
  } @else {
    <div class="container">
      <div class="empty">
        <div class="mark"><app-icon name="flower" [size]="58" [stroke]="1.1" /></div>
        <h1>Тут поки порожньо</h1>
        <p>Перед тим як змінити букет, виберіть його з каталогу.</p>
        <a routerLink="/catalog" class="btn btn--primary cta">До каталогу <app-icon name="arrow" [size]="18" /></a>
      </div>
    </div>
  }
</div>
